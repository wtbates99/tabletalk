# Run from dbt_project/ with: dbt build --profiles-dir .
#
# The portable default points to the demo database one directory above this
# project. Override it when needed:
#   export TABLETALK_ECOMMERCE_DB=/absolute/path/to/ecommerce.duckdb

ecommerce:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('TABLETALK_ECOMMERCE_DB', '../ecommerce.duckdb') }}"
      threads: 4
