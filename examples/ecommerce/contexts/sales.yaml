# contexts/sales.yaml
#
# "Sales" agent context — trusted dbt order facts plus the product sales graph.
#
# Revenue and customer questions should use the curated dbt `fct_orders` model.
# Raw line-item/product relations remain available for product-mix questions
# until they are replaced by a dedicated dbt line-item fact.
#
# Sample questions this agent can answer:
#   - "What is total revenue this month?"
#   - "Which products drive the most revenue?"
#   - "Show average order value by customer city"
#   - "How many orders are still pending?"
#   - "Who are the top 5 customers by spend?"
#   - "What is the month-over-month revenue trend?"

name: sales
description: >-
  Trusted dbt order facts plus product-level sales detail.
  Prefer fct_orders for order revenue, customer, status, and city analysis.
version: "1.0"

datasets:
  - name: main
    description: "Primary ecommerce schema"
    tables:
      # No duplicated description: TableTalk imports this model's business
      # meaning, columns, tests, and lineage from dbt's manifest.json.
      - name: fct_orders

      - name: orders
        description: >-
          Customer orders. status can be: pending, shipped, delivered, cancelled.
          total_amount is the subtotal after line discounts and before the order discount.
          discount_amount is the absolute order-level discount. For recognized
          net revenue, exclude cancelled orders and subtract the discount once.

      - name: order_items
        description: >-
          Individual line items within an order.
          FK: order_id → orders.id, product_id → products.id.
          unit_price is the price at time of purchase (may differ from current product price).

      - name: customers
        description: >-
          Customer accounts.  Join to orders on customer_id = customers.id.
          Use city/country for geographic segmentation.

      - name: products
        description: >-
          Product catalogue.  Join to order_items on product_id = products.id.
          price is the current retail price.  cost is the COGS for margin analysis.

      - name: categories
        description: >-
          Product categories.  Join to products on category_id = categories.id.
          Use for category-level revenue breakdowns.
