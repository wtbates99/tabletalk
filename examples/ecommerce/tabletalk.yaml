# tabletalk.yaml — Ecommerce Demo Project
#
# Uses a low-usage Ollama Cloud model so the demo is fast on any machine.
#
# Prerequisites:
#   1. Install Ollama:  https://ollama.com
#   2. Sign in:         ollama signin
#   3. Pull the model:  ollama pull gemma4:31b-cloud
#   4. Ollama runs on http://localhost:11434 by default — no config needed
#   5. Seed the DB:     python seed.py
#   6. Compile:         tabletalk apply
#   7. Query:           tabletalk query  (or  tabletalk serve)

# ── Database connection ───────────────────────────────────────────────────────
provider:
  type: duckdb
  database_path: ./ecommerce.duckdb   # created by `python seed.py`

# ── LLM — Ollama Cloud free tier ──────────────────────────────────────────────
llm:
  provider: ollama
  api_key: ollama                      # Ollama handles cloud authentication
  model: gemma4:31b-cloud              # low usage, strong coding, 256K context
  base_url: http://localhost:11434/v1
  max_tokens: 2000
  temperature: 0

# Model and quota errors are surfaced to the caller. TableTalk never swaps in
# a local heuristic, canned SQL, or a paid provider when Ollama cannot respond.

# ── Native dbt semantic context ───────────────────────────────────────────────
# Build dbt before `tabletalk apply`; TableTalk fails clearly if this artifact
# is absent rather than silently dropping the semantic contract.
dbt:
  manifest: dbt_project/target/manifest.json

# ── Project description ────────────────────────────────────────────────────────
description: >-
  Ecommerce platform — customers, orders, products, inventory, and marketing.
  DuckDB backend. Run `python seed.py` to initialise.

# ── Paths ─────────────────────────────────────────────────────────────────────
contexts: contexts      # directory containing agent context definitions
output: manifest        # directory where compiled manifests are written
safe_mode: true         # generated SQL must remain read-only
