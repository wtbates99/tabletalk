kind: EvalSuite
name: revenue-regression
agent: revenue
fixture:
  type: duckdb
  setup:
    - fixtures/schema.sql
    - fixtures/data.sql
cases:
  - name: recognized-revenue-by-category
    question: What was recognized revenue by product category in January 2026?
    expected_interpretation:
      metric: recognized_revenue
      start_date: "2026-01-01"
      end_date: "2026-02-01"
      timezone: UTC
    expect:
      executes: true
      read_only: true
      relations:
        required:
          - analytics.orders
          - analytics.order_items
          - analytics.products
      reference_sql: |
        SELECT p.category, SUM(i.recognized_revenue) AS revenue
        FROM analytics.order_items AS i
        JOIN analytics.orders AS o ON i.order_id = o.id
        JOIN analytics.products AS p ON i.product_id = p.id
        WHERE o.order_date >= '2026-01-01'
          AND o.order_date < '2026-02-01'
          AND o.status = 'complete'
        GROUP BY p.category
      result:
        comparison: unordered_rows
        absolute_tolerance: 0.01
      answer:
        require_supported_claims: true
        require_evidence: true
        required_disclosures:
          - exact_date_range
          - metric_definition
          - source_relation
  - name: join-multiplication-guard
    question: What was total recognized revenue in January 2026?
    expect:
      reference_sql: |
        SELECT SUM(i.recognized_revenue) AS revenue
        FROM analytics.order_items AS i
        JOIN analytics.orders AS o ON i.order_id = o.id
        WHERE o.order_date >= '2026-01-01'
          AND o.order_date < '2026-02-01'
          AND o.status = 'complete'
      result:
        comparison: scalar
        absolute_tolerance: 0.01
      answer:
        require_supported_claims: true
        require_evidence: true
