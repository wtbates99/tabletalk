connections:
  production:
    type: snowflake
    account: ${SNOWFLAKE_ACCOUNT}
    user: ${SNOWFLAKE_USER}
    password: ${SNOWFLAKE_PASSWORD}
    database: ANALYTICS
    warehouse: TABLETALK_WH
    role: TABLETALK_READONLY
    schema: PUBLIC
    read_only: true

llm:
  provider: openai-compatible
  base_url: ${TABLETALK_LLM_BASE_URL}
  api_key: ${TABLETALK_LLM_API_KEY}
  model: ${TABLETALK_LLM_MODEL}
  temperature: 0
  max_tokens: 4000
  request_timeout_seconds: 60

dbt:
  project_dir: ../analytics
  target_dir: ../analytics/target

agents: agents
evals: evals
