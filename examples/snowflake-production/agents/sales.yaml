kind: Agent
name: sales
description: Governed production revenue Agent over curated Snowflake relations.
connection: production
relations:
  include:
    - ANALYTICS.FCT_ORDERS
    - ANALYTICS.DIM_PRODUCTS
  exclude:
    - ANALYTICS.CUSTOMER_SENSITIVE
semantics:
  metrics:
    recognized_revenue:
      label: Recognized revenue
      description: Revenue after discounts, cancellations, and returns.
      expression: ANALYTICS.FCT_ORDERS.RECOGNIZED_REVENUE
      aggregation: sum
      time_dimension: ANALYTICS.FCT_ORDERS.ORDER_DATE
      unit: USD
      required_filters:
        - ANALYTICS.FCT_ORDERS.ORDER_STATUS != 'cancelled'
  time:
    timezone: America/New_York
    week_start: monday
    default_dimension: ANALYTICS.FCT_ORDERS.ORDER_DATE
  rules:
    - State exact calendar boundaries and timezone.
    - Ask for clarification when gross versus recognized revenue is material.
policies:
  read_only: true
  require_evidence: true
  allow_ambiguous_execution: false
  max_rows: 500
  timeout_seconds: 30
  max_repair_attempts: 1
evals:
  - sales-production-regression
