kind: EvalSuite
name: sales-production-regression
agent: sales
fixture:
  type: duckdb
  setup:
    - fixtures/schema.sql
    - fixtures/data.sql
cases:
  - name: cancellation-filter
    question: What was recognized revenue for July 20 through July 21, 2026?
    expected_interpretation:
      metric: recognized_revenue
      start_date: "2026-07-20"
      end_date: "2026-07-22"
      timezone: America/New_York
    expect:
      relations:
        required: [ANALYTICS.FCT_ORDERS]
        forbidden: [ANALYTICS.CUSTOMER_SENSITIVE]
      reference_sql: |
        SELECT SUM(RECOGNIZED_REVENUE) AS REVENUE
        FROM ANALYTICS.FCT_ORDERS
        WHERE ORDER_DATE >= '2026-07-20'
          AND ORDER_DATE < '2026-07-22'
          AND ORDER_STATUS != 'cancelled'
      result:
        comparison: scalar
        absolute_tolerance: 0.01
      answer:
        require_supported_claims: true
        require_evidence: true
        required_disclosures:
          - exact_date_range
          - metric_definition
          - source_relation
