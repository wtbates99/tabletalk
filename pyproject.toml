[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tabletalk"
version = "0.5.0"
description = "Evaluation and observability for natural-language agents over dbt projects"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "CC BY-NC 4.0" }
authors = [{ name = "william bates", email = "wtbates99@gmail.com" }]
keywords = ["sql", "llm", "dbt", "database", "natural-language", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pyyaml>=6.0",
    "click>=8.0",
    "openai>=1.0.0",
    "rich>=13.0",
    "sqlglot>=25.0",
]

[project.optional-dependencies]
snowflake = ["snowflake-connector-python>=3.0"]
duckdb    = ["duckdb>=0.9"]
all = [
    "snowflake-connector-python>=3.0",
    "duckdb>=0.9",
]

[project.scripts]
tabletalk = "tabletalk.cli:cli"

[project.urls]
Homepage   = "https://github.com/wtbates99/tabletalk"
Repository = "https://github.com/wtbates99/tabletalk"

[dependency-groups]
dev = [
    "mypy>=1.0",
    "types-PyYAML>=6.0",
    "types-setuptools",
    "pytest>=7.0",
    "ruff>=0.4",
    "duckdb>=0.9",
    "sphinx>=7.0",
    "myst-parser>=3.0",
    "dbt-duckdb>=1.9,<2",
]

[tool.pytest.ini_options]
testpaths = ["tabletalk/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
markers = [
    "live_ollama: opt-in tests requiring a running Ollama daemon and pulled model",
]

[tool.hatch.build.targets.wheel]
packages = ["tabletalk"]
exclude = ["/tabletalk/tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tabletalk/tests/**" = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
exclude = ["tabletalk/tests/"]
