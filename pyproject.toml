[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tabletalk"
version = "0.6.0"
description = "dbt-native development, evaluation, and observability for trusted data agents"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "LICENSE_HISTORY.md"]
authors = [{ name = "William Bates", email = "wbates@palanbates.com" }]
keywords = ["sql", "llm", "dbt", "evaluation", "data-agents", "observability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "pyyaml>=6.0",
    "click>=8.0",
    "openai>=1.0.0",
    "rich>=13.0",
    "sqlglot>=25.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
snowflake = ["snowflake-connector-python>=3.0"]
duckdb    = ["duckdb>=0.9"]
mcp       = ["mcp>=2,<3"]
all = [
    "snowflake-connector-python>=3.0",
    "duckdb>=0.9",
    "mcp>=2,<3",
]

[project.scripts]
tabletalk = "tabletalk.cli:cli"

[project.urls]
Homepage   = "https://github.com/wtbates99/tabletalk"
Repository = "https://github.com/wtbates99/tabletalk"

[dependency-groups]
dev = [
    "mypy>=1.0",
    "types-PyYAML>=6.0",
    "types-setuptools",
    "pytest>=7.0",
    "ruff>=0.4",
    "duckdb>=0.9",
    "sphinx>=7.0",
    "myst-parser>=3.0",
    "dbt-duckdb>=1.9,<2",
    "mcp>=2,<3",
]

[tool.pytest.ini_options]
testpaths = ["tabletalk/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
markers = [
    "live_ollama: opt-in tests requiring a running Ollama daemon and pulled model",
]

[tool.hatch.build.targets.wheel]
packages = ["tabletalk"]
exclude = ["/tabletalk/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
# Keep (str, Enum): StrEnum changes str() output of members.
ignore = ["UP042"]

[tool.ruff.lint.per-file-ignores]
"tabletalk/tests/**" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
exclude = ["tabletalk/tests/"]
