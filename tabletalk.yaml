
# Configuration for the data provider
provider:
  type: sqlite
  database_path: ./tabletalk.db

# Configuration for the LLM — Ollama Cloud free-tier default
llm:
  provider: ollama
  api_key: ollama
  model: gemma4:31b-cloud
  base_url: http://localhost:11434/v1
  max_tokens: 2000
  temperature: 0
  reasoning_effort: none
  request_timeout_seconds: 60

contexts: contexts
output: manifest
safe_mode: true
