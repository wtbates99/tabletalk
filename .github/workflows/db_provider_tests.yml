name: Test supported providers

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-suffix: py${{ matrix.python-version }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install supported database extras
        run: uv sync --all-extras

      - name: Run tests
        run: uv run pytest -q

      - name: Run static checks
        run: |
          uv run ruff check tabletalk
          uv run mypy tabletalk

  package:
    name: Verify PyPI distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Build distribution
        run: uv build

      - name: Validate PyPI metadata
        run: uvx twine check --strict dist/*

      - name: Verify wheel contents and installation
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("*.whl"))
          with ZipFile(wheel) as archive:
              names = archive.namelist()
          assert not any("/tests/" in name for name in names)
          assert not any("tabletalk/static/" in name for name in names)
          assert "tabletalk/app.py" not in names
          for required in (
              "tabletalk/agents.py",
              "tabletalk/evals/__init__.py",
              "tabletalk/manifest.py",
              "tabletalk/project.py",
              "tabletalk/runtime/__init__.py",
              "tabletalk/validation.py",
          ):
              assert required in names, f"missing wheel module: {required}"
          PY
          uv venv .package-test
          uv pip install --python .package-test/bin/python dist/*.whl
          .package-test/bin/tabletalk --version
          .package-test/bin/python -c "from tabletalk import Agent, EvalSuite, Project"
